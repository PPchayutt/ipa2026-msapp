<html>
<head>
  <title>Router Management</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <h1>Router Configuration Management</h1>
  <form method="POST" action="/add">
    <input name="ip" placeholder="Router IP" required />
    <input name="username" placeholder="Username" required />
    <input name="password" type="password" placeholder="Password" required />
    <button type="submit">Add Router</button>
  </form>

  <h2>Registered Routers:</h2>
  <ul>
    {% for router in routers %}
      <li>
        <strong>IP:</strong> <a href="/router/{{ router.ip }}">{{ router.ip }}</a> | 
        <strong>User:</strong> {{ router.username }}
        <form method="POST" action="/delete/{{ router._id }}" style="display:inline">
          <button type="submit">Delete</button>
        </form>
      </li>
    {% endfor %}
  </ul>
</body>
</html>
